<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="renderer" content="webkit">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<title>{{page_title}}</title>
<!--
  本页由 fabu-deepseek-harness 的 scripts/render_pages.py 依据稿件生成。
  版式复刻自参考页 {{source_page}}
  样式、站点标识与分享图标字体均已内联，单文件即可离线打开，不请求任何外部资源。
-->
<style>
{{site_css}}
</style>
</head>
<body>
<div class="preview" id="preview">

  <div class="section navigator">
    <div class="wrap">
      <a class="site-logo" href="{{site_home}}"><img src="{{logo_data_uri}}" alt="{{site_name}}"></a>
      <div class="site-name">{{site_name}}</div>
      <div class="site-sub">官方网址:{{site_domain}}</div>
      <nav class="site-nav">
        <ul class="menu-list">
{{nav_html}}
        </ul>
      </nav>
    </div>
  </div>

  <div class="section detail">
    <div class="ap-container">
      <div class="layout">
        <div class="main">
          <h1 class="article-title">{{article_title}}</h1>
          <div class="article-meta"><a href="{{category_url}}" rel="category">{{category}}</a> / {{datetime}}</div>
          <div class="detail-content">
{{body_html}}
          </div>
          <div class="share social-share">{{share_html}}</div>
        </div>

        <aside class="sidebar">
{{sidebar_html}}
        </aside>
      </div>
    </div>
  </div>

  <div class="section footer">
    <div class="footer-red"></div>
    <div class="footer-wrap">
{{footer_html}}
    </div>
  </div>
  <div class="section section-icp"><a href="{{icp_href}}" target="_blank" rel="nofollow">{{icp_text}}</a></div>

</div>
<script>
/* 窄屏等比缩放：与参考页一致，窗口宽度不足 1400px 时整页缩放而不是重排。 */
(function () {
  var preview = document.getElementById('preview');
  var CONTENT_WIDTH = 1400;
  function fit() {
    if (window.innerWidth <= 700) { return; }
    if (window.innerWidth < CONTENT_WIDTH) {
      var scale = window.innerWidth / CONTENT_WIDTH;
      preview.style.transform = 'scale(' + scale + ')';
      preview.style.transformOrigin = 'left top';
      preview.style.width = CONTENT_WIDTH + 'px';
      document.body.style.height = (preview.offsetHeight * scale) + 'px';
      document.body.style.overflow = 'hidden';
    } else {
      preview.style.transform = 'none';
      preview.style.width = '100%';
      document.body.style.height = 'auto';
      document.body.style.overflow = 'auto';
    }
  }
  fit();
  window.addEventListener('resize', fit);
})();
</script>
</body>
</html>
